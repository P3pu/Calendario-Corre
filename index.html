  <script>
    // Dados e regra de publicação são avaliados no head para descobrir a primeira imagem cedo.
    const events = [
      {
        name: 'Dog Race — São Paulo', day: '12', month: 'SET', dateTime: '2026-09-12', status: 'ativo',
        location: 'Parque Villa Lobos', locationSlug: 'villa-lobos', type: 'Corrida com pets',
        url: 'https://www.runningland.com.br/dog-race-s-o-paulo-2026'
      },
      {
        name: 'Circuito das Estações — Primavera — São Paulo', day: '13', month: 'SET', dateTime: '2026-09-13', status: 'ativo',
        location: 'Praça Charles Miller — Pacaembu', locationSlug: 'pacaembu', type: 'Circuito de rua',
        url: 'https://www.runningland.com.br/circuito-das-estacoes-2026-primavera-s-o-paulo'
      },
      {
        name: 'Movimento pela Saúde — Drogaria São Paulo', day: '20', month: 'SET', dateTime: '2026-09-20', status: 'ativo',
        location: 'Parque Villa Lobos', locationSlug: 'villa-lobos', type: 'Corrida de rua',
        url: 'https://pay.ativo.com/evento/40321'
      },
      {
        name: 'Super Humans — São Paulo', day: '20', month: 'SET', dateTime: '2026-09-20', status: 'ativo',
        location: 'Praça Heróis da FEB', locationSlug: 'herois-feb', type: 'Corrida de rua',
        url: 'https://www.runningland.com.br/super-humans-s-o-paulo-2026'
      },
      {
        name: 'Corrida do Pão — São Paulo', day: '27', month: 'SET', dateTime: '2026-09-27', status: 'encerrado',
        location: 'Ibirapuera', locationSlug: 'ibirapuera', type: 'Corrida de rua',
        url: 'https://pay.ativo.com/evento/40283'
      },
      {
        name: 'Blue Line — São Paulo', day: '27', month: 'SET', dateTime: '2026-09-27', status: 'ativo',
        location: 'Parque do Povo', locationSlug: 'parque-do-povo', type: 'Corrida de rua',
        url: 'https://www.runningland.com.br/blue-line-s-o-paulo-2026'
      },
      {
        name: 'Girl Power — São Paulo', day: '18', month: 'OUT', dateTime: '2026-10-18', status: 'ativo',
        location: 'Parque Villa Lobos', locationSlug: 'villa-lobos', type: 'Corrida de rua',
        url: 'https://www.runningland.com.br/girl-power-s-o-paulo-etapa-2-2026'
      },
      {
        name: 'Smart Fit Run — São Paulo', day: '18', month: 'OUT', dateTime: '2026-10-18', status: 'ativo',
        location: 'Parque da Independência', locationSlug: 'independencia', type: 'Corrida de rua',
        url: 'https://www.runningland.com.br/smart-fit-run-2026-s-o-paulo'
      },
      {
        name: 'Circuitinho — São Paulo', day: '24', month: 'OUT', dateTime: '2026-10-24', status: 'ativo',
        location: 'Pista de Atletismo — Centro Olímpico', locationSlug: 'centro-olimpico', type: 'Evento esportivo',
        url: 'https://www.runningland.com.br/circuitinho-das-estacoes-s-o-paulo-2026'
      },
      {
        name: 'Eco Run Special Edition — São Paulo', day: '29', month: 'NOV', dateTime: '2026-11-29', status: 'ativo',
        location: 'Parque da Independência', locationSlug: 'independencia', type: 'Corrida de rua',
        url: 'https://www.runningland.com.br/eco-run-totalenergies-s-o-paulo-2026'
      },
      {
        name: 'Circuito das Estações — Verão — São Paulo', day: '20', month: 'DEZ', dateTime: '2026-12-20', status: 'ativo',
        location: 'Praça Charles Miller — Pacaembu', locationSlug: 'pacaembu', type: 'Circuito de rua',
        url: 'https://www.runningland.com.br/circuito-das-estacoes-2026-ver-o-s-o-paulo'
      }
    ];

    // imageBase aponta para as variantes em assets/: <base>-<largura> (imagem inteira)
    // e <base>-card-<largura> (recorte central 3:2). imageAlt descreve a foto exibida no modal.
    const locations = [
      {
        slug: 'villa-lobos', name: 'Parque Villa Lobos', accent: '#d7f56c',
        imageBase: 'assets/parque-villa-lobos', imagePosition: 'center', layout: 'location-card--wide',
        imageAlt: 'Gramado arborizado com quiosques e uma grande cúpula de vidro, com prédios da cidade ao fundo'
      },
      {
        slug: 'pacaembu', name: 'Praça Charles Miller — Pacaembu', accent: '#ff674d',
        imageBase: 'assets/pacaembu', imagePosition: 'center', layout: '',
        imageAlt: 'Pessoas se exercitando e correndo no gramado em frente à fachada do Estádio do Pacaembu'
      },
      {
        slug: 'independencia', name: 'Parque da Independência', accent: '#73c9f1',
        imageBase: 'assets/parque-independencia', imagePosition: 'center', layout: '',
        imageAlt: 'Corredores na alameda cercada de palmeiras que leva ao Museu do Ipiranga'
      },
      {
        slug: 'ibirapuera', name: 'Ibirapuera', accent: '#ffd46a',
        imageBase: 'assets/ibirapuera', imagePosition: 'center', layout: '',
        imageAlt: 'Lago cercado de árvores, com um obelisco à esquerda e prédios da cidade ao fundo'
      },
      {
        slug: 'centro-olimpico', name: 'Pista de Atletismo — Centro Olímpico', accent: '#a993ff',
        imageBase: 'assets/centro-olimpico', imagePosition: 'center', layout: '',
        imageAlt: 'Atletas correndo em uma pista de atletismo vermelha, com arquibancada coberta ao fundo'
      },
      {
        slug: 'parque-do-povo', name: 'Parque do Povo', accent: '#ff91c3',
        imageBase: 'assets/parque-do-povo', imagePosition: 'center', layout: '',
        imageAlt: 'Pessoas lendo, conversando e correndo em um gramado cercado por prédios altos'
      },
      {
        slug: 'herois-feb', name: 'Praça Heróis da FEB', accent: '#69e0cf',
        imageBase: 'assets/praca-herois-feb', imagePosition: 'center', layout: 'location-card--wide',
        imageAlt: 'Corredores e ciclistas passando por uma praça com um avião de caça exposto como monumento'
      }
    ];

    // Status ausentes ou desconhecidos ficam ocultos por segurança.
    const PUBLIC_EVENT_STATUSES = new Set(['ativo', 'aberto', 'inscricoes_abertas']);

    function normalizeEventStatus(status) {
      return String(status || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, '_');
    }

    function isEventPublished(event, referenceDate = new Date()) {
      if (!PUBLIC_EVENT_STATUSES.has(normalizeEventStatus(event.status))) return false;

      const eventEnd = new Date(`${event.dateTime}T23:59:59-03:00`);
      return !Number.isNaN(eventEnd.getTime()) && eventEnd >= referenceDate;
    }

    const publishedEvents = events.filter((event) => isEventPublished(event));
    const publishedLocations = locations.filter((location) =>
      publishedEvents.some((event) => event.locationSlug === location.slug)
    );

    const firstLocation = publishedLocations[0];
    if (firstLocation) {
      const preload = document.createElement('link');
      const isWide = firstLocation.layout === 'location-card--wide';
      const mobileCardBase = `${firstLocation.imageBase}-card`;
      const desktopCardBase = isWide ? firstLocation.imageBase : mobileCardBase;
      const widths = isWide ? [800, 1200, 1560] : [520, 780, 1020];
      const sizes = isWide ? '780px' : '(max-width: 620px) max(450px, calc(100vw - 28px)), 510px';
      preload.rel = 'preload';
      preload.as = 'image';
      preload.type = 'image/avif';
      preload.fetchPriority = 'high';
      preload.imageSrcset = widths.map((width) => `${desktopCardBase}-${width}.avif ${width}w`).join(', ');
      preload.imageSizes = sizes;
      if (isWide) {
        // O card largo usa recorte até 900px e imagem inteira no desktop.
        preload.media = '(min-width: 901px)';
        const mobilePreload = preload.cloneNode();
        mobilePreload.media = '(max-width: 900px)';
        mobilePreload.imageSrcset = [520, 780, 1020].map((width) => `${mobileCardBase}-${width}.avif ${width}w`).join(', ');
        mobilePreload.imageSizes = '(max-width: 620px) max(450px, calc(100vw - 28px)), 510px';
        document.head.append(mobilePreload);
      }
      document.head.append(preload);
    }
  </script>

  <style>
    /* Fontes self-hosted (variáveis, subconjunto latin, que cobre o português). As faixas de peso
       são as mesmas que o Google Fonts servia, para a renderização não mudar. Licença OFL em assets/fonts/. */
    @font-face {
      font-family: "DM Sans";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("assets/fonts/dm-sans-latin-variable.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    }

    :root {
      --ink: #101d26;
      --ink-soft: #34434c;
      --paper: #f4f2ed;
      --white: #fff;
      --accent: #ff593d;
      --lime: #d7f56c;
      --line: rgba(16, 29, 38, .13);
      --shadow: 0 22px 60px rgba(16, 29, 38, .12);
      --radius: 26px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    button { color: inherit; }
    img { display: block; max-width: 100%; }
    .container { width: min(1180px, calc(100% - 40px)); margin-inline: auto; }
    .visually-hidden {
      position: absolute !important;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: inherit;
      text-decoration: none;
      font-family: "Manrope", sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand span span { color: var(--lime); }

    .events { position: relative; padding: 50px 0 120px; }
    /* É o h1 da página: o nome acessível vem do alt do banner. */
    .campaign-banner {
      overflow: hidden;
      margin: 0 0 30px;
      border-radius: var(--radius);
      background: var(--ink);
      box-shadow: 0 18px 48px rgba(16,29,38,.12);
    }
    .campaign-banner picture { display: block; }
    .campaign-banner img {
      width: 100%;
      /* Sem height:auto o atributo height vira altura fixa e anula o aspect-ratio (CLS + banner cortado). */
      height: auto;
      aspect-ratio: 1180 / 256;
      object-fit: cover;
      object-position: center;
    }

    .locations-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-flow: dense;
      gap: 22px;
    }
    .location-card {
      position: relative;
      min-height: 340px;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: var(--radius);
      color: var(--white);
      background: var(--ink);
      box-shadow: 0 1px 0 rgba(16,29,38,.05);
      text-align: left;
      cursor: pointer;
      isolation: isolate;
      transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    }
    .location-card--wide { grid-column: span 2; }
    .location-card:hover { transform: translateY(-7px); box-shadow: var(--shadow); }
    .location-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8,17,23,.04) 20%, rgba(8,17,23,.86) 100%),
        linear-gradient(135deg, color-mix(in srgb, var(--location-accent) 44%, transparent), transparent 52%);
    }
    .location-card img {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .75s cubic-bezier(.2,.8,.2,1), filter .35s ease;
    }
    .location-card:hover img { transform: scale(1.055); filter: saturate(1.08); }
    /* A faixa escura acompanha a altura do texto (1 a 3 linhas), garantindo contraste mesmo em fotos claras. */
    .location-card-content {
      position: absolute;
      inset: auto 0 0;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 64px 27px 27px;
      background: linear-gradient(180deg, rgba(8,17,23,0), rgba(8,17,23,.66) 32%, rgba(8,17,23,.72));
    }
    .location-card-copy { min-width: 0; }
    .location-count {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 11px;
      color: var(--white);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(8,17,23,.7);
    }
    .location-count::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--location-accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--location-accent) 24%, transparent);
    }
    .location-name {
      display: block;
      max-width: 430px;
      font-family: "Manrope", sans-serif;

      line-height: 1.04;
      letter-spacing: -.045em;
    }
    .location-action {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      transition: color .25s ease, background .25s ease, transform .25s ease;
    }
    .location-action svg { width: 20px; }
    .location-card:hover .location-action { color: var(--ink); background: var(--location-accent); transform: rotate(-8deg); }

    .noscript-notice {
      padding: 28px 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--white);
    }
    .noscript-notice h2 {
      margin: 0 0 10px;
      font-family: "Manrope", sans-serif;
      font-size: 24px;
      letter-spacing: -.03em;
    }
    .noscript-notice p { margin: 0; color: var(--ink-soft); line-height: 1.6; }
    .noscript-notice a { color: var(--ink); font-weight: 700; }

    body.modal-open { overflow: hidden; }
    .location-modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      opacity: 0;
      transition: opacity .22s ease;
    }
    .location-modal[hidden] { display: none; }
    .location-modal.is-open { opacity: 1; }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(7,15,20,.74);
      backdrop-filter: blur(9px);
    }
    .modal-dialog {
      position: relative;
      width: min(760px, 100%);
      max-height: min(860px, calc(100vh - 48px));
      overflow: auto;
      border-radius: 30px;
      background: var(--paper);
      box-shadow: 0 30px 100px rgba(0,0,0,.35);
      opacity: 0;
      transform: translateY(24px) scale(.98);
      transition: opacity .28s ease, transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .location-modal.is-open .modal-dialog { opacity: 1; transform: translateY(0) scale(1); }
    .modal-hero { position: relative; height: 260px; overflow: hidden; color: var(--white); background: var(--ink); }
    .modal-hero > picture { display: block; height: 100%; }
    .modal-hero > picture img { width: 100%; height: 100%; object-fit: cover; }
    .modal-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8,17,23,.2), rgba(8,17,23,.6) 40%, rgba(8,17,23,.92));
    }
    .modal-close {
      position: absolute;
      z-index: 2;
      top: 20px;
      right: 20px;

      place-items: center;

      height: 44px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;

    .modal-intro { margin: 0 0 17px; color: var(--ink-soft); font-size: 13px; font-weight: 700; }

    }
    .modal-register:hover { color: var(--ink); background: var(--accent); transform: translateY(-2px); }

    .site-footer { padding: 34px 0; color: rgba(255,255,255,.65); background: var(--ink); }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 12px; }
    .footer-brand { color: var(--white); }
    /* Contorno escuro sobre fundos claros; verde-limão só sobre a foto escura do modal. */
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .modal-hero :focus-visible { outline-color: var(--lime); }

    @media (max-width: 900px) {
      .locations-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .location-card--wide { grid-column: span 1; }
    }
    @media (max-width: 620px) {
      .container { width: min(100% - 28px, 1180px); }
      .events { padding: 80px 0 85px; }
      .campaign-banner { margin-bottom: 52px; border-radius: 18px; }
      .campaign-banner img { min-height: 160px; aspect-ratio: auto; }
      .footer-inner { align-items: flex-start; flex-direction: column; }
      .locations-grid { grid-template-columns: 1fr; }
      .location-card { min-height: 300px; }
      .location-card-content { padding: 56px 23px 23px; }
      .location-name { font-size: 28px; }
      .location-modal { padding: 10px; }
      .modal-dialog { max-height: calc(100vh - 20px); border-radius: 23px; }
      .modal-hero { height: 220px; }
      .modal-heading { inset: auto 23px 24px; }
      .modal-content { padding: 23px; }
      .modal-event { grid-template-columns: 57px minmax(0, 1fr); gap: 13px; padding: 13px; }
      .modal-date { min-height: 55px; }
      .modal-register { grid-column: 2; justify-self: start; padding: 9px 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PXKPSLRJ"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <main>
    <section class="events" id="eventos" aria-labelledby="events-title">
      <div class="container">
        <h1 class="campaign-banner" id="events-title">
          <picture>
            <source
              type="image/avif"
              srcset="assets/banner-calendario-corre-800.avif 800w, assets/banner-calendario-corre-1200.avif 1200w, assets/banner-calendario-corre-1800.avif 1800w, assets/banner-calendario-corre-2360.avif 2360w"
              sizes="(max-width: 620px) 740px, min(1180px, calc(100vw - 40px))">
            <img
              src="assets/banner-calendario-corre-1200.webp"
              srcset="assets/banner-calendario-corre-800.webp 800w, assets/banner-calendario-corre-1200.webp 1200w, assets/banner-calendario-corre-1800.webp 1800w, assets/banner-calendario-corre-2360.webp 2360w"
              sizes="(max-width: 620px) 740px, min(1180px, calc(100vw - 40px))"
              width="1180"
              height="256"
              alt="Calendário do Corre"
              fetchpriority="high">
          </picture>
        </h1>

        <div class="locations-grid" id="locations-grid"></div>
        <noscript>
          <div class="noscript-notice">
            <h2>O calendário precisa de JavaScript</h2>
            <p>
              Ative o JavaScript no navegador para ver os locais e as datas das próximas corridas de 2026.
              Enquanto isso, as inscrições estão disponíveis diretamente na
              <a href="https://www.runningland.com.br/">Running Land</a> e na
              <a href="https://www.ativo.com/">Ativo</a>.
            </p>
          </div>
        </noscript>
      </div>
    </section>
  </main>

  <div class="location-modal" id="location-modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-hero">
        <picture>
          <source id="modal-image-avif" type="image/avif">
          <img id="modal-image" alt="" width="1560" height="680">
        </picture>
        <div class="modal-hero-overlay"></div>
        <button class="modal-close" type="button" data-modal-close aria-label="Fechar janela de eventos">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="modal-heading">
          <span class="modal-kicker" id="modal-count"></span>
          <h2 id="modal-title"></h2>
        </div>
      </div>
      <div class="modal-content">
        <p class="modal-intro">Próximas corridas neste local</p>
        <div class="modal-events" id="modal-events"></div>
      </div>
    </section>
  </div>

  <script>
    const arrowIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    // Variantes geradas por scripts/build-images.mjs (AVIF + WebP de cada largura).
    const FULL_IMAGE_WIDTHS = [800, 1200, 1560];
    const CARD_IMAGE_WIDTHS = [520, 780, 1020];
    // Os cards têm altura fixa (340px; 300px até 620px) e usam object-fit: cover, então a
    // largura necessária é max(largura do card, altura × proporção da imagem), não a largura do card.
    const CARD_SIZES = '(max-width: 620px) max(450px, calc(100vw - 28px)), 510px';
    const WIDE_CARD_SIZES = '780px';
    const MODAL_SIZES = '(max-width: 620px) max(505px, calc(100vw - 20px)), (max-width: 808px) calc(100vw - 48px), 760px';

    function createSrcSet(imageBase, widths, format) {
      return widths.map((width) => `${imageBase}-${width}.${format} ${width}w`).join(', ');
    }

    function createImageSources(imageBase, widths, sizes, media = '') {
      const mediaAttribute = media ? ` media="${media}"` : '';
      return ['avif', 'webp'].map((format) =>
        `<source${mediaAttribute} type="image/${format}" srcset="${createSrcSet(imageBase, widths, format)}" sizes="${sizes}">`
      ).join('');
    }

    // Nos cards a foto é decorativa (alt vazio): o botão já é nomeado pelo texto visível.
    function createLocationPicture(location, isFirstCard = false) {
      // Prioriza o primeiro card publicado, mesmo quando os locais anteriores ficam sem eventos.
      const loadingAttributes = isFirstCard ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"';
      const imgAttributes = `alt="" ${loadingAttributes} decoding="async" style="object-position: ${location.imagePosition}"`;
      const cardImageBase = `${location.imageBase}-card`;

      if (location.layout !== 'location-card--wide') {
        return `<picture>${createImageSources(cardImageBase, CARD_IMAGE_WIDTHS, CARD_SIZES)}
          <img src="${cardImageBase}-780.webp" width="1020" height="680" ${imgAttributes}></picture>`;
      }

      // O card largo só ocupa duas colunas acima de 900px; abaixo disso usa o recorte dos cards comuns.
      return `<picture>${createImageSources(cardImageBase, CARD_IMAGE_WIDTHS, CARD_SIZES, '(max-width: 900px)')}
        ${createImageSources(location.imageBase, FULL_IMAGE_WIDTHS, WIDE_CARD_SIZES)}
        <img src="${location.imageBase}-1200.webp" width="1560" height="680" ${imgAttributes}></picture>`;
    }

    const locationsGrid = document.querySelector('#locations-grid');
    const modal = document.querySelector('#location-modal');
    const modalDialog = modal.querySelector('.modal-dialog');
    const modalTitle = document.querySelector('#modal-title');
    const modalCount = document.querySelector('#modal-count');
    const modalImage = document.querySelector('#modal-image');
    const modalImageAvif = document.querySelector('#modal-image-avif');
    const modalEvents = document.querySelector('#modal-events');
    const modalCloseButton = modal.querySelector('.modal-close');
    let lastFocusedElement;
    let closeTimer;
    let openFrame;
    let isClosing = false;

    function createLocationCard(location, index) {
      const eventCount = publishedEvents.filter((event) => event.locationSlug === location.slug).length;
      const eventLabel = eventCount === 1 ? '1 corrida' : `${eventCount} corridas`;
      // Mantém a mesma sequência do texto visível: contagem seguida pelo nome do local.
      return `
        <button class="location-card ${location.layout}" type="button" data-location-card="${location.slug}"
          aria-haspopup="dialog" aria-label="${eventLabel} ${location.name}"
          style="--location-accent: ${location.accent}">
          ${createLocationPicture(location, index === 0)}
          <span class="location-card-content">
            <span class="location-card-copy">
              <span class="location-count">${eventLabel}</span>
              <span class="location-name">${location.name}</span>
            </span>
            <span class="location-action" aria-hidden="true">${arrowIcon}</span>
          </span>
        </button>`;
    }

    function formatEventDate(event) {
      // Meio-dia em Brasília evita que o fuso desloque a data para o dia anterior.
      return new Date(`${event.dateTime}T12:00:00-03:00`)
        .toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', timeZone: 'America/Sao_Paulo' });
    }

    function createModalEvent(event) {
      // "SET" abreviado é lido de forma ambígua por leitores de tela; a data por extenso fica oculta visualmente.
      return `
        <article class="modal-event">
          <time class="modal-date" datetime="${event.dateTime}">
            <strong aria-hidden="true">${event.day}</strong><span aria-hidden="true">${event.month}</span>
            <span class="visually-hidden">${formatEventDate(event)}</span>
          </time>
          <div class="modal-event-copy">
            <span class="modal-event-name">${event.name}</span>
            <span class="modal-event-type">${event.type}</span>
          </div>
          <a class="modal-register" href="${event.url}" target="_blank" rel="noopener noreferrer"
            aria-label="Inscreva-se em ${event.name} (abre em nova aba)">Inscreva-se</a>
        </article>`;
    }

    // Enquanto o modal está aberto, o resto da página fica inerte: sem foco por teclado
    // e fora do alcance do cursor virtual de leitores de tela.
    function setPageInert(isInert) {
      document.querySelectorAll('main, .site-footer').forEach((region) => { region.inert = isInert; });
    }

    function openLocationModal(locationSlug) {
      const location = locations.find((item) => item.slug === locationSlug);
      const locationEvents = publishedEvents.filter((event) => event.locationSlug === locationSlug);
      if (!location) return;

      clearTimeout(closeTimer);
      isClosing = false;
      lastFocusedElement = document.activeElement;
      modalTitle.textContent = location.name;
      modalCount.textContent = locationEvents.length === 1 ? '1 corrida neste local' : `${locationEvents.length} corridas neste local`;
      modalImageAvif.srcset = createSrcSet(location.imageBase, FULL_IMAGE_WIDTHS, 'avif');
      modalImageAvif.sizes = MODAL_SIZES;
      modalImage.src = `${location.imageBase}-1200.webp`;
      modalImage.srcset = createSrcSet(location.imageBase, FULL_IMAGE_WIDTHS, 'webp');
      modalImage.sizes = MODAL_SIZES;
      modalImage.alt = location.imageAlt;
      modalImage.style.objectPosition = location.imagePosition;
      modalEvents.innerHTML = locationEvents.map(createModalEvent).join('');
      modal.hidden = false;
      setPageInert(true);
      document.body.classList.add('modal-open');
      openFrame = requestAnimationFrame(() => {
        modal.classList.add('is-open');
        modalCloseButton.focus();
      });
    }

    function closeLocationModal() {
      // Fecha mesmo antes do primeiro frame da animação e ignora Esc repetido.
      if (modal.hidden || isClosing) return;
      isClosing = true;
      cancelAnimationFrame(openFrame);

      modal.classList.remove('is-open');
      document.body.classList.remove('modal-open');
      setPageInert(false);
      closeTimer = window.setTimeout(() => {
        modal.hidden = true;
        modalImageAvif.srcset = '';
        modalImageAvif.sizes = '';
        modalImage.removeAttribute('src');
        modalImage.srcset = '';
        modalImage.sizes = '';
        if (lastFocusedElement) lastFocusedElement.focus();
      }, 240);
    }

    locationsGrid.innerHTML = publishedLocations.map(createLocationCard).join('');

    locationsGrid.addEventListener('click', (clickEvent) => {
      const card = clickEvent.target.closest('[data-location-card]');
      if (card) openLocationModal(card.dataset.locationCard);
    });

    modal.querySelectorAll('[data-modal-close]').forEach((control) => {
      control.addEventListener('click', closeLocationModal);
    });

    document.addEventListener('keydown', (keyEvent) => {
      if (modal.hidden) return;
      if (keyEvent.key === 'Escape') closeLocationModal();
      if (keyEvent.key === 'Tab') {
        const focusable = [...modalDialog.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')];
        const current = focusable.indexOf(document.activeElement);
        // current === -1 cobre o foco no próprio diálogo (ex.: após clique em área não focável).
        if (keyEvent.shiftKey && current <= 0) {
          keyEvent.preventDefault();
          focusable[focusable.length - 1].focus();
        } else if (!keyEvent.shiftKey && (current === -1 || current === focusable.length - 1)) {
          keyEvent.preventDefault();
          focusable[0].focus();
        }
      }
    });

  </script>

  <!-- O footer vem depois do script que monta o grid: se viesse antes, o Chrome pode fazer o
       layout dele logo abaixo do banner e depois empurrá-lo para baixo (CLS de até 0,8). -->
  <footer class="site-footer">
    <div class="footer-inner container">
      <span class="brand footer-brand"><span>corrida<span>SP</span></span></span>
      <span>Eventos esportivos gerenciados pela norteMKT</span>
      <span>São Paulo · <span id="year">2026</span></span>
    </div>
  </footer>
  <script>document.querySelector('#year').textContent = new Date().getFullYear();</script>
</body>
</html>
